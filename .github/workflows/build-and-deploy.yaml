name: Build and Deploy
permissions:
  contents: read
  packages: write

on: push

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  manifest:
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Merge into multi-arch latest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}:latest \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Delete old untagged, keep the 2 arch images behind latest
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 2

  deploy:
    runs-on: ubuntu-26.04
    needs: manifest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Deploy to k8s with helm
        uses: WyriHaximus/github-action-helm3@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}
          overrule_existing_kubeconfig: true
          exec: |
            helm upgrade $(echo "${{ github.event.repository.name }}" | tr -d '.') helm-charts \
              --atomic \
              --debug \
              --history-max 2 \
              --install \
              --set-string image.tag="latest" \
              --set-string "env[0].name=TELEGRAM_SALE_BOT_TOKEN" --set-string "env[0].value=${{ secrets.TELEGRAM_SALE_BOT_TOKEN }}" \
              --set-string "env[1].name=DATABASE_URL" --set-string "env[1].value=${{ secrets.DATABASE_URL }}" \
              --set-string "env[2].name=TELEGRAM_GROUP_ID" --set-string "env[2].value=${{ vars.TELEGRAM_GROUP_ID }}" \
              --set-string "env[3].name=TELEGRAM_GROUP_LINK" --set-string "env[3].value=${{ vars.TELEGRAM_GROUP_LINK }}" \
              --set-string "env[4].name=TELEGRAM_SALE_DAY" --set-string "env[4].value=${{ vars.TELEGRAM_SALE_DAY }}" \
              --set-string podAnnotations.deployedAt="$(TZ='Asia/Jakarta' date +'%Y-%m-%dT%H:%M:%S%z')" \
              --set-string podAnnotations.deployedBy="${{ github.actor }}" \
              --set-string podAnnotations.projectBranch="${{ github.ref_name }}" \
              --set-string podAnnotations.projectCommit="$(echo $GITHUB_SHA | cut -c1-7)" \
              --set-string podAnnotations.projectPath="${{ github.repository }}" \
              --wait
