overrides:
  deepmerge-ts: ^8.0.0
  mysql2: ^3.23.1
  http-cache-semantics: ^4.3.0

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0
